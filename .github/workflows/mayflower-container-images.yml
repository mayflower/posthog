name: Mayflower Container Images

on:
    push:
        branches:
            - master
    workflow_dispatch:

concurrency:
    group: mayflower-container-images-${{ github.ref }}
    cancel-in-progress: true

env:
    REGISTRY: ghcr.io
    APP_IMAGE: ghcr.io/mayflower/posthog
    NODE_IMAGE: ghcr.io/mayflower/posthog-node

jobs:
    posthog:
        name: Build and push PostHog image
        if: github.repository == 'mayflower/posthog' && github.ref == 'refs/heads/master'
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        permissions:
            contents: read
            packages: write

        steps:
            - name: Check out
              uses: actions/checkout@v6
              with:
                  fetch-depth: 2

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  platforms: linux/amd64
                  tags: |
                      ${{ env.APP_IMAGE }}:master
                      ${{ env.APP_IMAGE }}:${{ github.sha }}
                  labels: |
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                  build-args: |
                      COMMIT_HASH=${{ github.sha }}
                      BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
                  cache-from: type=gha,scope=posthog
                  cache-to: type=gha,scope=posthog,mode=max

    posthog-node:
        name: Build and push PostHog node image
        if: github.repository == 'mayflower/posthog' && github.ref == 'refs/heads/master'
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        permissions:
            contents: read
            packages: write

        steps:
            - name: Check out
              uses: actions/checkout@v6
              with:
                  fetch-depth: 2

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: Dockerfile.node
                  push: true
                  platforms: linux/amd64
                  tags: |
                      ${{ env.NODE_IMAGE }}:master
                      ${{ env.NODE_IMAGE }}:${{ github.sha }}
                  labels: |
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                  build-args: |
                      COMMIT_HASH=${{ github.sha }}
                  cache-from: type=gha,scope=posthog-node
                  cache-to: type=gha,scope=posthog-node,mode=max
