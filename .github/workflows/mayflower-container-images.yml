name: Mayflower Container Images

on:
    push:
        branches:
            - master
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
    cancel-in-progress: false

env:
    REGISTRY: ghcr.io
    APP_IMAGE: ghcr.io/mayflower/posthog
    NODE_IMAGE: ghcr.io/mayflower/posthog-node

jobs:
    posthog:
        name: Build and push PostHog image
        if: github.repository == 'mayflower/posthog' && github.ref == 'refs/heads/master'
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        permissions:
            contents: read
            packages: write

        steps:
            - name: Check out
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 2

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

            - name: Log in to GHCR
              uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push image
              uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
              with:
                  context: .
                  push: true
                  platforms: linux/amd64
                  tags: |
                      ${{ env.APP_IMAGE }}:master
                      ${{ env.APP_IMAGE }}:${{ github.sha }}
                  labels: |
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                  build-args: |
                      COMMIT_HASH=${{ github.sha }}
                      BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
                  cache-from: type=gha,scope=posthog
                  cache-to: type=gha,scope=posthog,mode=max

    posthog-node:
        name: Build and push PostHog node image
        if: github.repository == 'mayflower/posthog' && github.ref == 'refs/heads/master'
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        permissions:
            contents: read
            packages: write

        steps:
            - name: Check out
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 2

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

            - name: Log in to GHCR
              uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push image
              uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
              with:
                  context: .
                  file: Dockerfile.node
                  push: true
                  platforms: linux/amd64
                  tags: |
                      ${{ env.NODE_IMAGE }}:master
                      ${{ env.NODE_IMAGE }}:${{ github.sha }}
                  labels: |
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                  build-args: |
                      COMMIT_HASH=${{ github.sha }}
                  cache-from: type=gha,scope=posthog-node
                  cache-to: type=gha,scope=posthog-node,mode=max
